<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>📝 My Notes</h1>
    

<button onclick="toggleTheme()">🌙 Dark/Light Mode</button>
 
<input type="text" id="search" placeholder="Search notes..." onkeyup="searchNotes()">
    <textarea id="note" placeholder="Write your note..."></textarea>

    <button onclick="saveNote()">Save Note</button>
    <button onclick="deleteAllNotes()">Delete All Notes</button>

    <div id="notes"></div>
</div>

<script src="script.js"></script>
</body>
</html>
